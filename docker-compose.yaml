services:
  app:
    restart: unless-stopped
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      HOME: /data/home
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      WEB_RUNTIME: prod
      PORT: "3000"
      LINKEDIN_ACCOUNTS_DIR: /data/linkedin-accounts
      LINKEDIN_BROWSER_CDP_URL_1: http://linkedin-browser-1:9222
      LINKEDIN_BROWSER_CDP_URL_2: http://linkedin-browser-2:9222
    shm_size: "1gb"
    labels:
      traefik.enable: "true"
      traefik.http.routers.linkedin-outreach.rule: Host(`deguraleads.de`) || Host(`www.deguraleads.de`) || Host(`report.deguraleads.de`)
      traefik.http.routers.linkedin-outreach.entrypoints: websecure
      traefik.http.routers.linkedin-outreach.tls: "true"
      traefik.http.routers.linkedin-outreach.tls.certresolver: letsencrypt
      traefik.http.services.linkedin-outreach.loadbalancer.server.port: "3000"
    volumes:
      - scraper_auth:/data/scraper
      - sender_auth:/data/sender
      - playwright_cache:/ms-playwright
      - app_home:/data/home
      - app_logs:/app/.logs
      - linkedin_accounts_state:/data/linkedin-accounts
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:3000/api/health >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s
  linkedin-browser-1:
    restart: unless-stopped
    build:
      context: .
      dockerfile: docker/playwright-remote/Dockerfile
    environment:
      HOME: /data/home
      DISPLAY: ":99"
      CHROME_USER_DATA_DIR: /data/browser/profile
      LINKEDIN_LOGIN_URL: https://www.linkedin.com/login
    shm_size: "1gb"
    volumes:
      - linkedin_browser_1_profile:/data/browser
      - app_home:/data/home
    ports:
      - "127.0.0.1:6080:6080"
      - "127.0.0.1:9222:9222"
    labels:
      traefik.enable: "true"
      traefik.http.routers.linkedin-browser-1.rule: (Host(`deguraleads.de`) || Host(`www.deguraleads.de`)) && PathPrefix(`/linkedin-browser-1`)
      traefik.http.routers.linkedin-browser-1.entrypoints: websecure
      traefik.http.routers.linkedin-browser-1.tls: "true"
      traefik.http.routers.linkedin-browser-1.tls.certresolver: letsencrypt
      traefik.http.routers.linkedin-browser-1.middlewares: linkedin-browser-1-strip
      traefik.http.middlewares.linkedin-browser-1-strip.stripprefix.prefixes: /linkedin-browser-1
      traefik.http.services.linkedin-browser-1.loadbalancer.server.port: "6080"
  linkedin-browser-2:
    restart: unless-stopped
    build:
      context: .
      dockerfile: docker/playwright-remote/Dockerfile
    environment:
      HOME: /data/home
      DISPLAY: ":99"
      CHROME_USER_DATA_DIR: /data/browser/profile
      LINKEDIN_LOGIN_URL: https://www.linkedin.com/login
    shm_size: "1gb"
    volumes:
      - linkedin_browser_2_profile:/data/browser
      - app_home:/data/home
    ports:
      - "127.0.0.1:6081:6080"
      - "127.0.0.1:9223:9222"
    labels:
      traefik.enable: "true"
      traefik.http.routers.linkedin-browser-2.rule: (Host(`deguraleads.de`) || Host(`www.deguraleads.de`)) && PathPrefix(`/linkedin-browser-2`)
      traefik.http.routers.linkedin-browser-2.entrypoints: websecure
      traefik.http.routers.linkedin-browser-2.tls: "true"
      traefik.http.routers.linkedin-browser-2.tls.certresolver: letsencrypt
      traefik.http.routers.linkedin-browser-2.middlewares: linkedin-browser-2-strip
      traefik.http.middlewares.linkedin-browser-2-strip.stripprefix.prefixes: /linkedin-browser-2
      traefik.http.services.linkedin-browser-2.loadbalancer.server.port: "6080"

volumes:
  scraper_auth:
  sender_auth:
  playwright_cache:
  app_home:
  app_logs:
  linkedin_accounts_state:
  linkedin_browser_1_profile:
  linkedin_browser_2_profile:
